<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0c1015" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Theme FOUC guard (design audit P2 §7 row 4). Plain, synchronous JS —
         runs before any stylesheet paints and before the module script below
         is even fetched — so an explicit light/dark pick from a prior visit
         applies before first paint instead of flashing the OS-default theme
         first. Duplicates just the read+apply half of
         src/store/themeStore.ts's contract (same 'airlens-theme' key, same
         fallback-to-'system' rule) because a plain <script> here can't
         import that module; keep the two in sync if either changes. */
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem('airlens-theme');
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored);
          }
        } catch (e) {
          // Storage denied/unavailable — falls through to tokens.css's
          // prefers-color-scheme default, same as themeStore.ts's own
          // try/catch fallback.
        }
      })();
    </script>
    <title>AirLens — The Story of Our Atmosphere</title>
    <meta name="description" content="AirLens — Glass-box air quality intelligence with PM2.5, AOD, and policy impact analysis across global cities." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://airlens.cloud/" />

    <!-- Open Graph / Twitter defaults. The SSR shell (functions/_lib/render.ts)
         rewrites these per-route on /blog, /blog/:slug, /news/:slug,
         /country/:code, /dispatch, /today, /insights — HTMLRewriter only
         rewrites elements that already exist, so these placeholders must stay
         even though the default SPA route (/) never overwrites them itself. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AirLens" />
    <meta property="og:title" content="AirLens — The Story of Our Atmosphere" />
    <meta property="og:description" content="AirLens — Glass-box air quality intelligence with PM2.5, AOD, and policy impact analysis across global cities." />
    <meta property="og:url" content="https://airlens.cloud/" />
    <meta property="og:image" content="https://airlens.cloud/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AirLens — The Story of Our Atmosphere" />
    <meta name="twitter:description" content="AirLens — Glass-box air quality intelligence with PM2.5, AOD, and policy impact analysis across global cities." />
    <meta name="twitter:image" content="https://airlens.cloud/og-image.png" />

    <!-- Site-wide structured data (Organization + WebSite), ported verbatim from
         AirLens-platform apps/web/index.html. Static so crawlers see it on the
         homepage (no SSR for /); the SSR shell (functions/_lib/render.ts) appends
         page-specific JSON-LD on the routes listed above without removing it. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://airlens.cloud/#organization",
            "name": "AirLens",
            "url": "https://airlens.cloud",
            "logo": "https://airlens.cloud/icon-512.png",
            "description": "Glass-box air quality intelligence — satellite-derived PM2.5 estimates and SDID clean-air policy impact analysis with published uncertainty."
          },
          {
            "@type": "WebSite",
            "@id": "https://airlens.cloud/#website",
            "name": "AirLens",
            "url": "https://airlens.cloud",
            "publisher": { "@id": "https://airlens.cloud/#organization" }
          }
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Fonts ported from AirLens-platform apps/web/index.html, minus Crimson Pro
         (that one is self-hosted instead — see src/styles/typography.css
         @font-face, Wave 4 Block 2, resolving porting-brief decision #2).
         Inter's ital axis stays loaded for non-Crimson italic usages elsewhere
         (content/static/insights pending-summary copy, landing chapters). -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500;600;700&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
