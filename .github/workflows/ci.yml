name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One live run per PR. Pushing three times to a branch used to leave three full
# runs racing to completion; only the last one's verdict was ever read, and the
# other two still billed every minute they ran.
#
# `cancel-in-progress` is deliberately PR-only. On `main` each run is the record
# for one commit — cancelling it would leave that commit with no verdict at all,
# which is a worse trade than the minutes it saves. Main runs queue instead.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # gitleaks-action v2 lists the PR's commits via the API on pull_request runs.
  pull-requests: read

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history for all branches — the design-lint step's three-dot
          # diff needs origin/<base> AND a reachable merge base; the default
          # shallow checkout only fetches the PR merge ref at depth 1.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Design lint (coherence axes vs base)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # fetch-depth: 0 above provides origin/$BASE_REF and the merge base.
          # (A bare `git fetch origin $BASE_REF` would NOT create the
          # refs/remotes/origin/<base> ref here — actions/checkout restricts
          # the remote refspec to the PR merge ref.)
          npm run lint:design -- --base "origin/$BASE_REF"

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

  # workers/api and workers/public-api are standalone npm projects (own
  # lockfile, own tsconfig, own vitest config). The root `npm run test:run`
  # already sweeps their *.test.ts under the root jsdom config — the same way it
  # treats workers/assistant — but that is not their runtime (workerd/node) and
  # the root `tsc -b` only covers src/. This job runs each Worker's own
  # type-check and test scripts, exactly what its deploy workflow gates on.
  # workers/assistant is deliberately not listed: its own `tsc --noEmit` fails
  # on main today (src/liveData.test.ts, src/rag.test.ts), so adding it here
  # would turn CI red for a reason unrelated to this change.
  workers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        worker: [api, public-api]
    defaults:
      run:
        working-directory: workers/${{ matrix.worker }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/${{ matrix.worker }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run type-check

      - name: Test
        run: npm test

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # gitleaks-action 은 organization 소유 레포에서 유료 GITLEAKS_LICENSE 를
      # 요구한다 (2026-09-05 AirLens-cloud org 이전 직후 실측 — 모노레포와 동일).
      # gitleaks 바이너리는 MIT 무료 — CLI 직접 실행으로 대체 (버전·sha256 핀).
      - name: gitleaks (CLI)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA" 2>/dev/null; then
            ./gitleaks detect --config=gitleaks.toml --no-banner --redact \
              --log-opts="--no-merges --first-parent ${BASE_SHA}..${HEAD_SHA}"
          else
            echo "base sha unresolved — falling back to full working-tree scan"
            ./gitleaks detect --config=gitleaks.toml --no-banner --redact --no-git
          fi
