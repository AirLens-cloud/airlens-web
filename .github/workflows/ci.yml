name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  # gitleaks-action v2 lists the PR's commits via the API on pull_request runs.
  pull-requests: read

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history for all branches — the design-lint step's three-dot
          # diff needs origin/<base> AND a reachable merge base; the default
          # shallow checkout only fetches the PR merge ref at depth 1.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Design lint (coherence axes vs base)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # fetch-depth: 0 above provides origin/$BASE_REF and the merge base.
          # (A bare `git fetch origin $BASE_REF` would NOT create the
          # refs/remotes/origin/<base> ref here — actions/checkout restricts
          # the remote refspec to the PR merge ref.)
          npm run lint:design -- --base "origin/$BASE_REF"

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: gitleaks.toml
