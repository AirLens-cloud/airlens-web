name: Deploy Public API Worker

# Ported from the AirLens monorepo (.github/workflows/deploy-public-api.yml).
# Deploys workers/public-api (Worker `airlens-public-api`, served at
# https://api.airlens.cloud/v1/* via a Custom Domain bound in the Cloudflare
# dashboard — wrangler.toml deliberately carries no `routes`).
#
# TRIGGER: push to main (paths below) + workflow_dispatch. This repo is the
# only deployer of this Worker. The former monorepo workflow of the same name
# must stay disabled; re-enabling it would double-deploy.
#
# Required repo secrets (names only):
#   CLOUDFLARE_WORKERS_TOKEN — same dedicated token as deploy-api.yml; this
#                              Worker declares no routes, so it only uses the
#                              Workers Scripts Edit part
#   CLOUDFLARE_ACCOUNT_ID    — account that owns the Worker
on:
  push:
    branches: [main]
    paths:
      - 'workers/public-api/**'
      - '.github/workflows/deploy-public-api.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workers-deploy-public-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/public-api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/public-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check + unit tests (gate before deploy)
        run: |
          npm run type-check
          npm test

      - name: Preflight — deploy credentials present
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          [ -n "$TOKEN" ] || { echo "::error::CLOUDFLARE_WORKERS_TOKEN is not set"; missing=1; }
          [ -n "$ACCOUNT" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not set"; missing=1; }
          [ "$missing" = "0" ] || exit 1
          echo "deploy credentials present (values masked)"

      # The lockfile-pinned wrangler is used directly instead of
      # cloudflare/wrangler-action, so no new third-party action SHA is needed.
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
