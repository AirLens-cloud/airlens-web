name: Deploy to Cloudflare Pages

# The `airlens-web` Pages project has no Git provider attached (direct-upload
# only), so nothing deployed on a merge to main — three merged surfaces sat
# behind a build from before them, and every route fell through to the M0 data
# probe page. This workflow is the deploy path.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_PAGES_TOKEN  — scoped token, Account -> Cloudflare Pages -> Edit
#   CLOUDFLARE_ACCOUNT_ID   — the account the `airlens-web` project lives in
# Both are absent until someone adds them; the preflight below fails loudly
# rather than letting wrangler report a confusing auth error.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy-airlens-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # CI already gates typecheck/lint/test on this same commit. Build here so
      # what ships is built from this checkout, not fetched from another run.
      - name: Build
        run: npm run build

      - name: Preflight — deploy credentials present
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          [ -n "$TOKEN" ] || { echo "::error::CLOUDFLARE_PAGES_TOKEN is not set"; missing=1; }
          [ -n "$ACCOUNT" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not set"; missing=1; }
          [ "$missing" = "0" ] || exit 1
          echo "deploy credentials present (values masked)"

      - name: Deploy to Cloudflare Pages
        id: deploy
        # SHA-pinned (repo policy: third-party actions pin to a commit, not a
        # movable tag — this step receives the deploy credentials).
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name=airlens
            --branch=main
            --commit-dirty=true
            --commit-message="${{ github.sha }}"

      # A green deploy step is not proof the site serves this build — the stale
      # deployment that prompted this workflow also returned 200 on every path,
      # including routes it did not have. So assert on artifacts only a real
      # upload of THIS dist can produce: the entry bundle's content hash, plus
      # a sample of the files the entry alone would not catch (a lazily-loaded
      # route chunk, and the globe textures, which ship outside the JS graph
      # and so can fail to upload while every bundle succeeds).
      - name: Verify the deploy actually landed
        # Both HTTP surfaces are gated from this runner (measured 2026-09-02):
        # airlens.cloud serves the zone's bot challenge (403 + cf-mitigated:
        # challenge, run 33598172881) and <hash>.airlens.pages.dev sits behind
        # Cloudflare Access (302 to airlens-pages.cloudflareaccess.com, run
        # 33598937531). So the HARD assertion is the Pages API — the same
        # CLOUDFLARE_PAGES_TOKEN that deployed can read back whether this
        # run's deployment is the newest production deployment and finished
        # its deploy stage. HTTP probes still run but downgrade to warnings
        # when they hit the challenge or the Access wall; a clean HTTP
        # response with the WRONG entry still fails hard, because a stale
        # production alias is the failure this workflow exists to catch.
        # Adding CF_ACCESS_CLIENT_ID / CF_ACCESS_CLIENT_SECRET repo secrets
        # (a Cloudflare Access service token) restores full hard HTTP
        # verification with no workflow change.
        env:
          SITE: https://airlens.cloud
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          ACCESS_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -u
          fail=0

          # ---- local build integrity (no network) --------------------------
          local_entries=$(find dist/assets -maxdepth 1 -name 'index-*.js' | wc -l | tr -d ' ')
          if [ "$local_entries" != "1" ]; then
            echo "::error::expected exactly 1 dist/assets/index-*.js, found $local_entries — verification cannot identify the entry chunk"
            exit 1
          fi
          local_entry=$(basename "$(find dist/assets -maxdepth 1 -name 'index-*.js')")

          # Named explicitly, not globbed from dist: a glob can only check what
          # the build happened to emit, so a texture silently dropped from
          # public/ would vanish from the check list instead of failing. These
          # three are what globe-presets.ts references; OceanSphere logs
          # "Texture load failed" and renders a flat sphere without them.
          for tex in earth-land-mask.png earth-bump.png earth-night-2k.jpg; do
            if [ ! -f "dist/textures/$tex" ]; then
              echo "::error::dist/textures/$tex is missing from the build — public/textures/ lost a file globe-presets.ts needs"
              fail=1
            fi
          done

          # Representative code-split chunks. A name that stops matching must
          # fail: silently skipping it would turn this gate into a pass that
          # proves nothing. If a chunk is legitimately renamed or inlined into
          # the entry, update this list in the same PR.
          for name in Globe3DScene Insights idw.worker OceanSphere; do
            if [ -z "$(find dist/assets -maxdepth 1 -name "$name-*.js" | head -1)" ]; then
              echo "::error::no dist/assets/$name-*.js in this build — update the check list in this workflow"
              fail=1
            fi
          done

          # Pages metadata files — they carry the security headers and SPA
          # fallback, and no bundle references them.
          for meta in _headers _redirects; do
            if [ ! -f "dist/$meta" ]; then
              echo "::error::dist/$meta is missing — public/$meta was not copied into the build"
              fail=1
            fi
          done

          # ---- HARD: Pages API — did THIS deployment land as production? ---
          if [ -z "$DEPLOY_URL" ]; then
            echo "::error::wrangler-action returned no deployment-url — cannot identify this deployment"
            exit 1
          fi
          dep=$(curl -sf -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/airlens/deployments?env=production&per_page=1" \
            | jq -r --arg url "$DEPLOY_URL" \
              '.result[0] | "\(.url == $url) \(.latest_stage.name) \(.latest_stage.status)"' || echo "api-error")
          [ -n "$dep" ] || dep="api-error"
          echo "pages api — newest production deployment: is-this-run=$dep (expect: true deploy success)"
          case "$dep" in
            "true deploy success") echo "  ok   API confirms this run is the live production deployment" ;;
            "api-error") echo "::error::Pages API query failed — cannot confirm the deployment landed"; fail=1 ;;
            *) echo "::error::newest production deployment is not this run's, or its deploy stage is not success ($dep)"; fail=1 ;;
          esac

          # ---- HTTP probes: hard when reachable, warning when walled -------
          # A service token (if configured) authenticates through Access.
          acurl() { # curl with optional Access service-token headers
            if [ -n "$ACCESS_ID" ] && [ -n "$ACCESS_SECRET" ]; then
              curl -H "CF-Access-Client-Id: $ACCESS_ID" -H "CF-Access-Client-Secret: $ACCESS_SECRET" "$@"
            else
              curl "$@"
            fi
          }
          # blocked <headers-file> <code> → 0 when the response is the Access
          # login redirect or the zone bot challenge (i.e. unverifiable here).
          blocked() {
            [ "$2" = "302" ] && grep -qi '^location: .*cloudflareaccess\.com' "$1" && return 0
            grep -qi '^cf-mitigated: challenge' "$1" && return 0
            return 1
          }

          check_host() { # $1 = base URL, $2 = label
            code=$(acurl -s -D /tmp/vh -o /tmp/vb -w '%{http_code}' "$1/" || echo 000)
            if blocked /tmp/vh "$code"; then
              echo "::warning::$2 is walled from this runner (HTTP $code — Access login or bot challenge). Deployment already confirmed via the Pages API; add CF_ACCESS_CLIENT_ID/SECRET secrets for hard HTTP verification."
              return 1
            fi
            entry=$(grep -o 'index-[A-Za-z0-9_-]*\.js' /tmp/vb | head -1 || true)
            if [ "$entry" != "$local_entry" ]; then
              echo "::error::$2 serves entry ${entry:-<none>} (HTTP $code), built $local_entry — it is NOT serving this deploy"
              fail=1
              return 1
            fi
            echo "  ok   $2 serves this build's entry"
            return 0
          }

          if check_host "$DEPLOY_URL" "deployment URL"; then
            # Reachable — run the full asset/header/fallback sample hard.
            probe() {
              code=$(acurl -s -o /dev/null -w '%{http_code}' "$DEPLOY_URL$1" || true)
              if [ "$code" = "200" ]; then
                echo "  ok   $1"
              else
                echo "::error::$1 returned $code (expected 200) — this build's assets are not all served"
                fail=1
              fi
            }
            for tex in earth-land-mask.png earth-bump.png earth-night-2k.jpg; do
              [ -f "dist/textures/$tex" ] && probe "/textures/$tex"
            done
            for name in Globe3DScene Insights idw.worker OceanSphere; do
              chunk=$(find dist/assets -maxdepth 1 -name "$name-*.js" | head -1)
              [ -n "$chunk" ] && probe "/assets/$(basename "$chunk")"
            done
            csp=$(acurl -sI "$DEPLOY_URL/" | grep -ic '^content-security-policy:' || true)
            if [ "$csp" = "0" ]; then
              echo "::error::no Content-Security-Policy on $DEPLOY_URL/ — _headers did not take effect"
              fail=1
            else
              echo "  ok   Content-Security-Policy served"
            fi
            # SPA fallback: every path returns the same 200 shell (routing is
            # client-side), so a 200 means "fallback intact", not "route
            # renders" — the nonexistent path keeps that distinction visible.
            for route in / /globe /weather /insights /__no_such_route__; do
              code=$(acurl -s -o /dev/null -w '%{http_code}' "$DEPLOY_URL$route" || true)
              echo "  $code  $route"
              if [ "$code" != "200" ]; then
                echo "::error::$route returned $code — SPA fallback is broken"
                fail=1
              fi
            done
          fi

          # Production alias — the only check that speaks for airlens.cloud
          # itself. Same three-way logic: ok / walled warning / hard fail.
          check_host "$SITE" "production alias airlens.cloud" || true

          [ "$fail" = "0" ] || exit 1
          echo "deploy verified: Pages API confirms this deployment is live production; HTTP surfaces checked where reachable"
