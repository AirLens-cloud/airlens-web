name = "airlens-assistant"
main = "src/index.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

# ── Quota / session counter store ───────────────────────────────────────────
#
# `CHAT_QUOTA` is optional in `Env` and quota.ts fails **open** (no cap) when
# it is absent — same convention as workers/public-api's RL_KV. Namespace
# created out-of-band (`npx wrangler kv namespace create CHAT_QUOTA`).
[[kv_namespaces]]
binding = "CHAT_QUOTA"
id = "74c95e440afe4bc191128f0b1c774b24"

# ── Abuse gate (native Rate Limiting binding) ───────────────────────────────
#
# Atomic, unlike the read-then-write KV counters in quota.ts — which is why
# the two endpoints that must not be farmable sit behind it: POST /api/session
# (minting sessions, index.ts handleSession) and POST /api/admin/reindex
# (guessing ADMIN_REINDEX_SECRET). Documented constraints
# (developers.cloudflare.com/workers/runtime-apis/bindings/rate-limit/):
# `period` must be 10 or 60 seconds, and counting is per Cloudflare location —
# so this binding CANNOT express a daily cap. The daily cap stays in quota.ts,
# keyed by the daily-salted per-caller hash from session.ts resolveIdentifier;
# the two are a set, neither works alone. `namespace_id` is a local integer
# label (not an account resource — nothing to provision out-of-band).
[[ratelimits]]
name = "SESSION_RATE_LIMIT"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# ── Observability ────────────────────────────────────────────────────────────
#
# Workers Logs retention, so the fail-open token the Turnstile bypass emits
# (session.ts: ASSISTANT_TURNSTILE_FAIL_OPEN) is queryable after the fact
# rather than only visible in a live `wrangler tail`. Without this block a
# bot gate silently off in production leaves no searchable trace.
[observability]
enabled = true
head_sampling_rate = 1

# ── Workers AI ───────────────────────────────────────────────────────────────
#
# Always remote, even under `wrangler dev` — see wrangler's own docs. Model
# ids are vars (below), not hardcoded in src/, so a post-eval model swap (C4
# model-ab) is a config change.
[ai]
binding = "AI"

# ── Corpus vector store (design §1 D-3) ─────────────────────────────────────
#
# `airlens-assistant-corpus` created via:
#   npx wrangler vectorize create airlens-assistant-corpus --dimensions=1024 --metric=cosine
# 1024 dims = bge-m3's native embedding size. Populate/refresh with
# `node --experimental-strip-types scripts/build-corpus.mjs` (repo root) — see
# that script's header. VECTORIZE is optional in `Env`: unbound, queryCorpus
# (src/rag.ts) returns [] and chat still answers, just without citations.
[[vectorize]]
binding = "VECTORIZE"
index_name = "airlens-assistant-corpus"

# ── Route ────────────────────────────────────────────────────────────────
#
# Left to the dashboard on purpose (same rationale as workers/public-api in
# AirLens-platform): a `routes` entry naming a hostname with no DNS record
# makes `wrangler deploy` fail outright. Until a custom domain is bound, the
# deploy lands at https://airlens-assistant.<account>.workers.dev, which is
# enough to verify `GET /api/chat/health`. To pin the route in code instead
# of the dashboard, add:
#
# routes = [{ pattern = "assistant.airlens.cloud/*", zone_name = "airlens.cloud" }]

[vars]
# Session token TTL (seconds) — Field Assistant v2 design §1 D-2.
SESSION_TTL_SECONDS = "3600"
# Per-identifier burst cap (60s fixed window).
RATE_LIMIT_PER_MINUTE = "5"
# Per-identifier daily cap. Identifier = session hash (primary) or client IP
# (fallback when a request has no valid session — see session.ts resolveIdentifier).
DAILY_MESSAGE_LIMIT = "30"
# Account-wide daily request budget (generalized from the retired chatbot
# worker's "neuron budget"). Now tracks actual Workers AI neuron cost — C1
# had no LLM call yet (REQUEST_COST_ESTIMATE=1, a placeholder), C2 wires a
# real gemma+bge-m3 call behind this guard, so both are recalibrated together:
#
#   REQUEST_COST_ESTIMATE — per-chat-turn neuron estimate. Recalibrated
#   2026-09-03 (A-5 follow-up, round 2) after live production re-testing
#   showed MAX_TOKENS=1024 (round 1's value, validated only against a
#   synthetic FAKE_MATCHES fixture) still truncated real answers to 7-37
#   chars. Round 2 probed with REAL Vectorize retrieval (embedQuery +
#   queryCorpus against the live corpus, not synthetic citations) for both
#   production incident questions — real citation text draws measurably more
#   reasoning-token budget than the synthetic fixture did, which is why the
#   round-1 gate passed while production failed. 1024 and 1536 both
#   truncated or ran with an uncomfortably thin margin against observed
#   run-to-run variance (temperature=0.3 produced a ~135-completion-token
#   swing across repeated runs of the same question); MAX_TOKENS=2048 is the
#   first value with a comfortable safety margin (worst observed run used
#   1424/2048 = 70%, leaving 624 tokens of headroom) and is now adopted (see
#   MAX_TOKENS below). Using the same published Workers AI neuron pricing
#   (developers.cloudflare.com/workers-ai/platform/pricing/):
#   gemma-4-26b-a4b-it ≈ 9091 neurons/M input tokens + 27273 neurons/M output
#   tokens; bge-m3 ≈ 1075 neurons/M input tokens (query embed, ~30 tokens,
#   negligible). Worst case — a turn that fills the whole MAX_TOKENS budget
#   (finish_reason:"length") — at prompt_tokens 1843 (round-1's measured
#   ceiling; round 2's real-retrieval prompts measured 1736-1743, so 1843
#   remains a conservative input-token estimate) + completion_tokens 2048:
#   9091*1843/1e6 ≈ 16.8 neurons (input) + 27273*2048/1e6 ≈ 55.9 neurons
#   (output) ≈ 72.6 neurons. Cross-checked against the API's own reported
#   `usage.neurons` on two REAL-retrieval probes at max_tokens=2048
#   (completion_tokens=1061 → 44.72 neurons; completion_tokens=1424 → 54.68
#   neurons) — linear fit through those two points extrapolates to ~71.8
#   neurons at completion_tokens=2048, matching the pricing-table
#   calculation within 1%. This ~72.6-neuron figure is the WORST-CASE
#   ceiling (a turn whose completion runs all the way to MAX_TOKENS) — real
#   answers stop naturally well before that (finish_reason:"stop" in every
#   probe this round). Team-lead's explicit call (same date, round 2): base
#   REQUEST_COST_ESTIMATE on the MEASURED AVERAGE instead, as long as it
#   stays under the worst-case ceiling. Averaging all 4 non-truncated
#   real-retrieval probes this round (both incident questions, at both
#   max_tokens=1536 and 2048 — none truncated, so all 4 are valid
#   "what a real answer naturally costs" samples): (44.72 + 54.68 + 43.22 +
#   51.0) / 4 ≈ 48.4 neurons. Rounded up to 60 (~24% margin over the
#   average, still well under the 72.6 worst case).
#
#   TRADE-OFF this creates (stated plainly, not just the chosen number):
#   checkGlobalBudget (quota.ts) decrements a FIXED REQUEST_COST_ESTIMATE
#   per allowed turn — it never reads the API's own usage.neurons — so an
#   average-based estimate under-counts any turn that runs closer to the
#   72.6-neuron ceiling than to the average. At 60/turn the gate allows
#   floor(10000/60)=166 turns/day; if every one of those 166 turns happened
#   to hit the true worst case, actual spend would be 166*72.6≈12,053
#   neurons — ~20% over the 10,000 free-tier cap. A worst-case-based
#   estimate (~80, same convention as round 1's 1024-budget 44.7→50
#   rounding) would have mathematically guaranteed daily spend stayed under
#   the cap even in that scenario; this average-based estimate trades that
#   hard guarantee for close to 33% more daily turns at EXPECTED (not
#   worst-case) traffic, on the reasoning that a real user population's
#   answer lengths cluster near the average, not the ceiling.
#
#   DAILY_REQUEST_BUDGET — set to Workers AI's daily free-tier neuron
#   allocation (10,000/day, a platform constant — not tunable here) so
#   checkGlobalBudget (quota.ts) degrades to the RAG-only response
#   (chat-stream.ts buildDegradedStream — zero generation cost) once the
#   account's free neurons for the day are spent, rather than silently
#   running past them into billed usage. At 60 neurons/turn this is
#   10000/60 = 166 chat turns/day before degrading. EXPECTED spend at 166
#   turns/day x the 48.4-neuron measured average ≈ 8035 neurons (under the
#   cap); the worst-case-if-every-turn-maxes-out figure (≈12,053, over the
#   cap) is the trade-off documented above.
DAILY_REQUEST_BUDGET = "10000"
REQUEST_COST_ESTIMATE = "60"
MAX_MESSAGE_LENGTH = "2000"
MAX_HISTORY_TURNS = "10"
ALLOWED_ORIGINS = "https://airlens.cloud,https://www.airlens.cloud,http://localhost:5173,http://localhost:4173"

# Workers AI catalog ids (design §1 D-3/D-4) — confirmed present in this
# account's catalog via `npx wrangler ai models list` (2026-09-02).
CHAT_MODEL = "@cf/google/gemma-4-26b-a4b-it"
EMBEDDING_MODEL = "@cf/baai/bge-m3"
# A-5 follow-up (2026-09-03): REASONING_EFFORT="low" alone (below) did not
# fix the zero-token incident — it was necessary but not sufficient. Direct
# env.AI.run() probes against Workers AI (bypassing this worker entirely,
# via a throwaway wrangler-dev route, never committed) with the REAL
# SYSTEM_PROMPT (prompts.ts, ~4.3K chars: security_rules + platform_context +
# response_format) plus a realistic 5-citation grounded-context block
# (rag.ts buildGroundedContext, up to 5x300-char excerpts) measured
# prompt_tokens=1843-1844 — far above the ~42-token toy prompt that had
# earlier looked fine. At that real prompt size, even reasoning_effort:'low'
# spent the ENTIRE previous MAX_TOKENS=512 budget on reasoning before any
# content token: finish_reason:"length", completion_tokens:512 (exactly the
# cap), contentFrames:0 — reproducing the production incident exactly.
# Re-run at max_tokens=1024 with the same real prompt: finish_reason:"stop",
# full answer content, completion_tokens=737/1024 (headroom, not truncated).
# Round 1 adopted 1024 as "the minimum tested that doesn't truncate" — but
# that test used a synthetic FAKE_MATCHES fixture, not real retrieval. Live
# production re-gate (2026-09-03) at 1024 still truncated both incident
# questions to 7-37 chars, disproving round 1's fixture-based conclusion.
#
# Round 2 re-measured with REAL Vectorize retrieval (embedQuery + queryCorpus
# against the live corpus, same real SYSTEM_PROMPT) for both exact incident
# questions ("DQSS 점수가 뭔가요?", "AQI 등급은 어떻게 계산하나요?"):
#   max_tokens=2048 → both finish_reason:"stop", full answers (527 and 631
#     chars respectively), completion_tokens 1061/2048 and 1424/2048.
#   max_tokens=1536 → both also finish_reason:"stop" in this run
#     (completion_tokens 1006/1536, 1289/1536) — but re-running the same
#     questions is NOT deterministic (temperature=0.3): completion_tokens for
#     the AQI question varied 1289→1424 (a 135-token swing) across separate
#     runs at different caps, meaning 1536's ~250-token margin in one run
#     could have been a truncation in another. 2048's worst observed margin
#     (624 tokens, 30% of budget) comfortably absorbs that variance; 1536
#     does not.
#   No documented model-level output-token ceiling was found (Workers AI
#   catalog schema for this model lists max_tokens/max_completion_tokens as
#   unbounded integers; the only published limit, 256K tokens, is the INPUT
#   context window).
# 2048 adopted — not the single lowest value that happened to pass once, but
# the lowest value with margin over measured run-to-run variance.
MAX_TOKENS = "2048"
TEMPERATURE = "0.3"
# CHAT_MODEL is a reasoning-capable model — its thinking tokens draw from the
# SAME MAX_TOKENS budget as the visible answer. Left unset, some questions
# spent the whole 512-token budget on reasoning and streamed zero answer
# tokens (citations only, silent empty bubble — A-5 incident). "low" leaves
# more of the fixed budget for the actual answer; confirmed via the Workers
# AI catalog schema (developers.cloudflare.com/workers-ai/models/gemma-4-26b-a4b-it)
# that `reasoning_effort` is a distinct low/medium/high param, not a
# max_tokens substitute. Re-confirmed 2026-09-03: the catalog schema's enum
# is exactly {low, medium, high} — "low" is already the floor, there is no
# lower "none"/"minimal" tier to fall back to, so MAX_TOKENS (above) is the
# only remaining lever for this failure mode.
REASONING_EFFORT = "low"
# Vectorize topK per query — ported RAG_TOP_K=5 from the retired chatbot
# worker's rag.ts.
RAG_TOP_K = "5"

# C3 live-data tool call (src/liveData.ts) — the same public, keyless HF
# dataset repo this repo's own frontend reads (src/lib/config/dataSources.ts
# HF_LIVE_BASE). Server-Collect: fetched from the worker, not the browser,
# but it is the identical public URL either way — no new exposure surface.
HF_LIVE_BASE = "https://huggingface.co/datasets/Robeedau/airlens-live/resolve/main"

# Secrets (set via `npx wrangler secret put <NAME>`):
#   SESSION_HMAC_SECRET  — signs/verifies the session token (HMAC-SHA256).
#                          Required; there is no dev fallback for this one —
#                          `wrangler secret put SESSION_HMAC_SECRET --local`
#                          (or a .dev.vars file, gitignored) for local dev.
#   TURNSTILE_SECRET     — Cloudflare Turnstile secret key. Unset in dev/local
#                          → siteverify is skipped and a session is still
#                          issued (dev-bypass, logged via console.warn on every
#                          issuance so it is never mistaken for a verified
#                          production session). MUST be set before this worker
#                          is deployed to a real origin.
#   ADMIN_REINDEX_SECRET — shared secret for POST /api/admin/reindex. Unset
#                          → the endpoint refuses every request (503) rather
#                          than defaulting open (unlike the two secrets
#                          above) — an unauthenticated reindex lets an
#                          attacker plant "retrieved evidence" the model then
#                          treats as trusted AirLens documentation.
