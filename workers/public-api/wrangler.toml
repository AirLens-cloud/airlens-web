name = "airlens-public-api"
main = "src/index.ts"
compatibility_date = "2026-04-01"

# ── Route ────────────────────────────────────────────────────────────────────
#
# Left to the dashboard on purpose: `api.airlens.cloud` does not exist yet, and
# a `routes` entry naming a hostname with no DNS record makes `wrangler deploy`
# fail outright — the worker would not even reach its workers.dev URL. Until the
# custom domain is bound, the deploy lands at
# https://airlens-public-api.<account>.workers.dev, which is enough to verify
# `GET /v1/health`. To pin the route in code instead of the dashboard, add:
#
# routes = [{ pattern = "api.airlens.cloud/*", zone_name = "airlens.cloud" }]

[vars]
# Origin serving the public aq-data/** snapshots. DQSS W4 (2026-09-03) moved this
# from the Cloudflare Pages /data/** mirror to the HF dataset directly — Pages no
# longer republishes every snapshot the models pipeline writes (aq-data/data_quality.json
# in particular is HF-only). The worker reshapes those files and never reads the
# database, so there are no secrets in this worker — nothing here is server-only
# (contrast: the chatbot worker's SUPABASE_* secrets).
DATA_ORIGIN = "https://huggingface.co/datasets/Robeedau/airlens-live/resolve/main"
# Per-IP budget as reported to clients (RateLimit-Limit, Retry-After). It does
# not enforce anything — the [[ratelimits]] binding at the end of this file does
# — so keep the two pairs equal. Matches ratelimit.ts's built-in fallback
# (120 req / 60s) — declared explicitly so the effective limit is visible here
# rather than only in code.
RATE_LIMIT_MAX = "120"
RATE_LIMIT_WINDOW_SECONDS = "60"
# A keyless public read API is meant to be callable from anywhere, including
# third-party pages and notebooks; the data it returns is already public under
# aq-data/**. Restricting CORS would not protect anything, only break that use.
ALLOWED_ORIGINS = "*"

# ── Per-IP rate limit (ratelimit.ts, layer 2 of 3) ───────────────────────────
#
# Cloudflare's native Rate Limiting binding — the same mechanism as
# workers/assistant/wrangler.toml's SESSION_RATE_LIMIT (docs:
# developers.cloudflare.com/workers/runtime-apis/bindings/rate-limit/). It
# replaces the KV counter (`RL_KV`) this layer used before: a KV counter is a
# non-atomic read-then-write, and KV allows only one write per second to the
# same key (developers.cloudflare.com/kv/platform/limits/), so under a burst from
# one IP the counter's own writes can be rejected — which the old code treated
# as "allow".
#
# `limit` / `period` are what is ENFORCED: `limit` requests per `period` seconds
# per key (the client IP), counted separately in each Cloudflare location and
# approximate — a burst can overshoot. `period` must be 10 or 60. The
# RATE_LIMIT_MAX / RATE_LIMIT_WINDOW_SECONDS vars above only feed the
# RateLimit-Limit and Retry-After headers; keep both pairs equal.
#
# `namespace_id` must be unique within the Cloudflare account — the assistant
# Worker already uses "1001". Reusing a number would make two Workers share one
# counter per key.
#
# `IP_RATE_LIMIT` stays optional in `Env` and `ratelimit.ts` fails **open** when
# the binding is absent (and when `limit()` throws), which keeps unit tests and
# any unbound environment working. The flip side: a deploy that loses this
# binding switches the limit off — all that is left is one warning per isolate in
# the Worker's logs — so after touching this block confirm that a burst from one
# IP really gets a 429. (A test pins the binding's name and numbers to the code.)
#
# Kept last on purpose: in TOML every key after a table header belongs to that
# table, so a top-level key added below this point (`routes = …`, say) would be
# silently swallowed into `ratelimits` instead of erroring. Add new top-level
# keys ABOVE the first table header.

[[ratelimits]]
name = "IP_RATE_LIMIT"
namespace_id = "2001"
simple = { limit = 120, period = 60 }
